<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoShortVideos</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🚀 NoShortVideos</h1>
      <p>Mantenha o foco. Diga adeus às distrações infinitas.</p>
    </header>
    
    <main>
      <div class="toggle-container">
        <label for="toggle-youtube">YouTube Shorts</label>
        <label class="switch">
          <input type="checkbox" id="toggle-youtube" checked>
          <span class="slider round"></span>
        </label>
      </div>

      <div class="toggle-container">
        <label for="toggle-instagram">Instagram Reels</label>
        <label class="switch">
          <input type="checkbox" id="toggle-instagram" checked>
          <span class="slider round"></span>
        </label>
      </div>

      <div class="toggle-container">
        <label for="toggle-tiktok">TikTok Feeds</label>
        <label class="switch">
          <input type="checkbox" id="toggle-tiktok" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </main>

    <footer>
      <p>Desenvolvido com ☕ e foco.</p>
    </footer>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
