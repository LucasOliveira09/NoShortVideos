<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoShortVideos</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-wrapper">
        <img src="../../icons/icon.png" alt="Logo do Lobo" class="logo">
      </div>
      <h1>NoShortVideos</h1>
      <p>Mantenha o foco. Diga adeus às distrações infinitas.</p>
      <div class="instruction">
        <p>Deixe a chave <strong>ativada</strong> para ocultar os vídeos:</p>
      </div>
    </header>
    
    <main>
      <div class="toggle-container">
        <label for="toggle-youtube">Bloquear YouTube Shorts</label>
        <label class="switch">
          <input type="checkbox" id="toggle-youtube" checked>
          <span class="slider round"></span>
        </label>
      </div>

      <div class="toggle-container">
        <label for="toggle-instagram">Bloquear Instagram Reels</label>
        <label class="switch">
          <input type="checkbox" id="toggle-instagram" checked>
          <span class="slider round"></span>
        </label>
      </div>

      <div class="toggle-container">
        <label for="toggle-tiktok">Bloquear TikTok Feeds</label>
        <label class="switch">
          <input type="checkbox" id="toggle-tiktok" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </main>

    <footer>
      <a href="https://github.com/LucasOliveira09/">Apoie o projeto! <span>✨</span></a>
    </footer>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
